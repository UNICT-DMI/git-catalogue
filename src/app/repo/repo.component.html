<div class="media">
  <img
    [src]="'https://raw.githubusercontent.com/' + fullName + '/master/icon.png'"
    alt="{{ fullName }}"
    class="mr-3 logo-small"
    onerror="this.src = 'https://avatars.githubusercontent.com/u/25122687?s=200&v=4';"
  />
  <div class="media-body">
    <h4 class="mt-0 mb-0">
      <a href="#/details/{{ id }}">{{ name }}</a>
    </h4>
    <span class="text-muted text-tiny">
      <fa-icon [icon]="faStar"></fa-icon> {{ stars }} | Created {{ created | amTimeAgo }}
      <ng-container *ngIf="updated"> | Updated {{ updated | amTimeAgo }}</ng-container>
    </span>
    <p>{{ description }}</p>
  </div>
</div>
